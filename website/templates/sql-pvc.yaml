apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.mysql.name }}pvc
  namespace: {{ .Values.namespace }}
spec:
  volumeName: {{ .Values.mysql.name }}pv
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.mysql.storage }}
  volumeMode: Filesystem
