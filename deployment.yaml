apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment
  namespace: develop
  labels:
    app: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  template:
    metadata:
      labels:
        app: demo
    spec:
      containers:
      - name: mysql
        image: mysql:5.7
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: secret
              key: mysql-root-password
        - name: MYSQL_USER
          valueFrom:
            secretKeyRef:
              name: secret
              key: mysql-user
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: secret
              key: mysql-password
        - name: MYSQL_DATABASE
          valueFrom:
            secretKeyRef:
              name: secret
              key: mysql-database
        ports:
        - containerPort: 3306
        volumeMounts:
        - name: sqlstorage
          mountPath: /var/lib/mysql

      - name: wordpress
        image: wordpress:latest
        env:
        - name: WORDPRESS_DB_HOST
          valueFrom:
            secretKeyRef:
              name: secret
              key: wordpress-db-host
        - name: WORDPRESS_DB_USER
          valueFrom:
            secretKeyRef:
              name: secret
              key: mysql-user
        - name: WORDPRESS_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: secret
              key: mysql-password
        - name: WORDPRESS_DB_NAME
          valueFrom:
            secretKeyRef:
              name: secret
              key: mysql-database
        ports:
        - containerPort: 80
        volumeMounts:
        - name: webstorage
          mountPath: /var/www/html
      volumes:
      - name: webstorage
        persistentVolumeClaim:
          claimName: webpvc
      - name: sqlstorage
        persistentVolumeClaim:
          claimName: sqlpvc 

